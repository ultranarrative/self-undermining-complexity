<title>Self-Undermining Complexity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
  :root{
    --black:#191919; --panel:#1e1e1e; --panel-2:#242424; --rule:#333333;
    --white:#ffffff; --grey:#888888; --grey-2:#b4b4b4;
    --cyan:#4dd8ff; --pink:#ff99cc; --orange:#ff6633; --green:#00cc99;
    --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--black); color:var(--grey-2);
    font-family:var(--mono); font-size:14px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:40px 64px}
  .sym{font-family:var(--mono); color:var(--cyan); white-space:nowrap}
  cite{font-style:italic}

  /* ---------- gate ---------- */
  .gate{min-height:78vh; display:flex; align-items:center; justify-content:center}
  .gate-card{width:100%; max-width:430px; text-align:left}
  .gate-card .mark{width:190px; height:auto; display:block; margin-bottom:34px}
  .gate-card h1{
    font-family:var(--serif); font-weight:700; color:var(--white);
    font-size:clamp(26px,5vw,34px); line-height:1.15; margin:0 0 10px; text-wrap:balance;
  }
  .gate-card p{margin:0 0 26px; color:var(--grey); font-size:13px; max-width:46ch}
  .gate-form{display:flex; flex-direction:column; gap:12px}
  .gate-form label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey);
  }
  input[type=password]{
    width:100%; background:var(--panel); color:var(--white); font-family:var(--mono);
    font-size:15px; border:1px solid var(--rule); border-radius:3px; padding:13px 14px;
  }
  input[type=password]:focus-visible{outline:2px solid var(--cyan); outline-offset:1px; border-color:transparent}
  button{
    font-family:var(--mono); font-size:13px; font-weight:500; letter-spacing:.04em;
    background:var(--cyan); color:var(--black); border:0; border-radius:3px;
    padding:13px 18px; cursor:pointer;
  }
  button:hover{background:var(--white)}
  button:focus-visible{outline:2px solid var(--pink); outline-offset:2px}
  button[disabled]{opacity:.5; cursor:progress}
  .gate-error{color:var(--orange); font-size:12.5px; min-height:1.4em; margin:0}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    flex-wrap:wrap; padding-bottom:18px; border-bottom:1px solid var(--rule); margin-bottom:44px;
  }
  .masthead .mark{width:150px; height:auto; display:block}
  .masthead-meta{display:flex; gap:22px; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--grey)}

  /* ---------- lede ---------- */
  .lede{max-width:70ch; margin-bottom:46px}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--pink); margin:0 0 14px}
  h1{
    font-family:var(--serif); font-weight:700; color:var(--white);
    font-size:clamp(32px,6vw,52px); line-height:1.08; letter-spacing:-.01em;
    margin:0 0 20px; text-wrap:balance;
  }
  .standfirst{font-size:15px; line-height:1.72; margin:0; color:var(--grey-2)}

  /* ---------- instrument ---------- */
  .instrument{
    display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:22px;
    align-items:start; margin-bottom:52px;
  }
  .plot{margin:0; min-width:0}
  #plane{
    display:block; width:100%; aspect-ratio:4/3; max-width:100%;
    background:var(--panel); border:1px solid var(--rule); border-radius:3px;
  }
  .plot-key{display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:12px;
    font-size:11.5px; color:var(--grey)}
  .key{display:inline-flex; align-items:center; gap:7px}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
  .dot-stable{background:var(--cyan)}
  .dot-unstable{background:var(--orange)}
  .rule{width:15px; height:0; border-top:2px solid; display:inline-block}
  .rule-pred{border-color:var(--cyan)}
  .rule-crit{border-top-style:dashed; border-color:var(--grey)}
  figcaption{margin-top:14px; font-size:13px; color:var(--grey-2); max-width:62ch;
    min-height:3.2em}

  /* ---------- rail ---------- */
  .rail{display:flex; flex-direction:column; gap:18px; min-width:0}
  .readout{background:var(--panel); border:1px solid var(--rule); border-radius:3px; padding:18px}
  .readout-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .readout-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey)}
  .chip{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600;
    padding:4px 9px; border-radius:2px; background:var(--green); color:var(--black);
  }
  .chip[data-state=unstable]{background:var(--orange); color:var(--black)}
  .readout-value{
    display:block; font-size:38px; font-weight:500; color:var(--white);
    font-variant-numeric:tabular-nums; line-height:1.1; margin:10px 0 12px;
  }
  .meter{position:relative; height:4px; background:var(--panel-2); border-radius:2px; overflow:hidden}
  .meter-fill{position:absolute; inset:0 auto 0 0; width:0; background:var(--cyan)}
  .meter-fill[data-state=unstable]{background:var(--orange)}
  .meter-tick{position:absolute; top:-3px; bottom:-3px; left:66.6%; width:1px; background:var(--pink)}
  .stats{margin:18px 0 0; display:grid; gap:7px}
  .stats div{display:flex; justify-content:space-between; gap:12px; font-size:12.5px}
  .stats dt{color:var(--grey); margin:0}
  .stats dd{margin:0; color:var(--white); font-variant-numeric:tabular-nums}
  .note{margin:14px 0 0; font-size:11.5px; color:var(--orange); line-height:1.5}

  .controls{background:var(--panel); border:1px solid var(--rule); border-radius:3px;
    padding:18px; display:flex; flex-direction:column; gap:16px}
  .control{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline}
  .control label{font-size:12.5px; color:var(--grey-2)}
  .control output{font-size:12.5px; color:var(--white); font-variant-numeric:tabular-nums}
  input[type=range]{grid-column:1/-1; width:100%; margin:2px 0 0; accent-color:var(--cyan);
    background:transparent; cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--cyan); outline-offset:4px}
  #resample{margin-top:2px; background:var(--panel-2); color:var(--white);
    border:1px solid var(--rule)}
  #resample:hover{background:var(--rule)}

  /* ---------- findings ---------- */
  .findings{border-top:1px solid var(--rule); padding-top:40px; margin-bottom:48px}
  .findings h2{
    font-family:var(--serif); font-weight:700; color:var(--white);
    font-size:clamp(22px,3.4vw,28px); line-height:1.2; margin:0 0 30px; text-wrap:balance;
  }
  .findings article{margin-bottom:28px; max-width:72ch}
  .findings h3{
    font-size:12px; letter-spacing:.11em; text-transform:uppercase; font-weight:600;
    color:var(--pink); margin:0 0 9px;
  }
  .findings p{margin:0; font-size:14px; line-height:1.72}
  .findings em{color:var(--white); font-style:italic}

  /* ---------- colophon ---------- */
  .colophon{border-top:1px solid var(--rule); padding-top:26px; font-size:12px;
    color:var(--grey); line-height:1.7}
  .colophon p{margin:0 0 12px; max-width:78ch}
  .colophon strong{color:var(--grey-2); font-weight:500}
  .colophon-mark{font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin:0}

  @media (max-width:880px){
    .instrument{grid-template-columns:1fr}
    .rail{flex-direction:column}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password){
  const salt = b64(PAYLOAD.salt), iv = b64(PAYLOAD.iv), data = b64(PAYLOAD.ct);
  const km = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:PAYLOAD.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  return new TextDecoder().decode(plain);
}

const gate = document.getElementById("gate");
const form = document.getElementById("gate-form");
const errorEl = document.getElementById("gate-error");
const unlockBtn = document.getElementById("unlock");

form.addEventListener("submit", async e => {
  e.preventDefault();
  errorEl.textContent = "";
  unlockBtn.disabled = true;
  unlockBtn.textContent = "Unlocking";
  try{
    const html = await unlock(document.getElementById("pw").value);
    const app = document.getElementById("app");
    app.innerHTML = html;
    gate.hidden = true;
    app.hidden = false;
    window.scrollTo(0, 0);
    boot();
  }catch(err){
    errorEl.textContent = "That password does not match. Try again.";
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Unlock";
    document.getElementById("pw").select();
  }
});

/* ---------------- eigenvalues ----------------
   Householder reduction to Hessenberg form, then Francis double-shift QR.
   Eigenvalues only. Verified against LAPACK to 1.2e-14.                      */
function eigenvalues(Ain, n){
  const H = Ain.slice(), ort = new Float64Array(n);
  const at = (i,j) => i*n + j;
  const low = 0, high = n - 1;

  for(let m = low+1; m <= high-1; m++){
    let scale = 0;
    for(let i = m; i <= high; i++) scale += Math.abs(H[at(i,m-1)]);
    if(scale === 0) continue;
    let h = 0;
    for(let i = high; i >= m; i--){ ort[i] = H[at(i,m-1)]/scale; h += ort[i]*ort[i]; }
    let g = Math.sqrt(h);
    if(ort[m] > 0) g = -g;
    h -= ort[m]*g;
    ort[m] -= g;
    for(let j = m; j < n; j++){
      let f = 0;
      for(let i = high; i >= m; i--) f += ort[i]*H[at(i,j)];
      f /= h;
      for(let i = m; i <= high; i++) H[at(i,j)] -= f*ort[i];
    }
    for(let i = 0; i <= high; i++){
      let f = 0;
      for(let j = high; j >= m; j--) f += ort[j]*H[at(i,j)];
      f /= h;
      for(let j = m; j <= high; j++) H[at(i,j)] -= f*ort[j];
    }
    ort[m] *= scale;
    H[at(m,m-1)] = scale*g;
  }

  const d = new Float64Array(n), e = new Float64Array(n);
  const eps = Math.pow(2,-52);
  let nn = n-1, exshift = 0, iter = 0;
  let p=0,q=0,r=0,s=0,z=0,w,x,y;
  let norm = 0;
  for(let i=0;i<n;i++) for(let j=Math.max(i-1,0); j<n; j++) norm += Math.abs(H[at(i,j)]);

  while(nn >= low){
    let l = nn;
    while(l > low){
      s = Math.abs(H[at(l-1,l-1)]) + Math.abs(H[at(l,l)]);
      if(s === 0) s = norm;
      if(Math.abs(H[at(l,l-1)]) < eps*s) break;
      l--;
    }
    if(l === nn){
      d[nn] = H[at(nn,nn)] + exshift; e[nn] = 0; nn--; iter = 0;
    }else if(l === nn-1){
      w = H[at(nn,nn-1)]*H[at(nn-1,nn)];
      p = (H[at(nn-1,nn-1)] - H[at(nn,nn)])/2;
      q = p*p + w;
      z = Math.sqrt(Math.abs(q));
      x = H[at(nn,nn)] + exshift;
      if(q >= 0){
        z = p >= 0 ? p + z : p - z;
        d[nn-1] = x + z;
        d[nn] = z !== 0 ? x - w/z : d[nn-1];
        e[nn-1] = 0; e[nn] = 0;
      }else{
        d[nn-1] = x + p; d[nn] = x + p;
        e[nn-1] = z; e[nn] = -z;
      }
      nn -= 2; iter = 0;
    }else{
      x = H[at(nn,nn)]; y = 0; w = 0;
      if(l < nn){ y = H[at(nn-1,nn-1)]; w = H[at(nn,nn-1)]*H[at(nn-1,nn)]; }
      if(iter === 10 || iter === 20){
        exshift += x;
        for(let i = low; i <= nn; i++) H[at(i,i)] -= x;
        s = Math.abs(H[at(nn,nn-1)]) + Math.abs(H[at(nn-1,nn-2)]);
        x = y = 0.75*s; w = -0.4375*s*s;
      }
      iter++;
      if(iter > 60){ d[nn] = H[at(nn,nn)] + exshift; e[nn] = 0; nn--; iter = 0; continue; }
      s = (y - x)/2; s = s*s + w;
      if(s > 0){
        s = Math.sqrt(s);
        if(y < x) s = -s;
        s = x - w/((y - x)/2 + s);
        for(let i = low; i <= nn; i++) H[at(i,i)] -= s;
        exshift += s;
        x = y = w = 0.964;
      }
      let m = nn - 2;
      while(m >= l){
        z = H[at(m,m)];
        r = x - z; s = y - z;
        p = (r*s - w)/H[at(m+1,m)] + H[at(m,m+1)];
        q = H[at(m+1,m+1)] - z - r - s;
        r = H[at(m+2,m+1)];
        s = Math.abs(p) + Math.abs(q) + Math.abs(r);
        p /= s; q /= s; r /= s;
        if(m === l) break;
        if(Math.abs(H[at(m,m-1)])*(Math.abs(q)+Math.abs(r)) <
           eps*(Math.abs(p)*(Math.abs(H[at(m-1,m-1)])+Math.abs(z)+Math.abs(H[at(m+1,m+1)])))) break;
        m--;
      }
      for(let i = m+2; i <= nn; i++){
        H[at(i,i-2)] = 0;
        if(i > m+2) H[at(i,i-3)] = 0;
      }
      for(let k = m; k <= nn-1; k++){
        const notlast = k !== nn-1;
        if(k !== m){
          p = H[at(k,k-1)]; q = H[at(k+1,k-1)];
          r = notlast ? H[at(k+2,k-1)] : 0;
          x = Math.abs(p)+Math.abs(q)+Math.abs(r);
          if(x === 0) continue;
          p /= x; q /= x; r /= x;
        }
        s = Math.sqrt(p*p + q*q + r*r);
        if(p < 0) s = -s;
        if(s !== 0){
          if(k !== m) H[at(k,k-1)] = -s*x;
          else if(l !== m) H[at(k,k-1)] = -H[at(k,k-1)];
          p += s;
          x = p/s; y = q/s; z = r/s;
          q /= p; r /= p;
          for(let j = k; j < n; j++){
            p = H[at(k,j)] + q*H[at(k+1,j)];
            if(notlast){ p += r*H[at(k+2,j)]; H[at(k+2,j)] -= p*z; }
            H[at(k,j)] -= p*x;
            H[at(k+1,j)] -= p*y;
          }
          for(let i = 0; i <= Math.min(nn, k+3); i++){
            p = x*H[at(i,k)] + y*H[at(i,k+1)];
            if(notlast){ p += z*H[at(i,k+2)]; H[at(i,k+2)] -= p*r; }
            H[at(i,k)] -= p;
            H[at(i,k+1)] -= p*q;
          }
        }
      }
    }
  }
  return {re:d, im:e};
}

/* ---------------- the instrument ---------------- */
const SMAX = 140;
let U = null, Z = null, seed = 20260918;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* One fixed pool of randomness for every draw, so moving a slider morphs the
   same community rather than resampling a new one on every frame. */
function fillPool(){
  const rand = mulberry32(seed);
  const N = SMAX*SMAX;
  U = new Float64Array(N); Z = new Float64Array(N);
  for(let i = 0; i < N; i++) U[i] = rand();
  for(let i = 0; i < N; i += 2){
    const u1 = Math.max(rand(), 1e-12), u2 = rand();
    const R = Math.sqrt(-2*Math.log(u1)), th = 2*Math.PI*u2;
    Z[i] = R*Math.cos(th);
    if(i+1 < N) Z[i+1] = R*Math.sin(th);
  }
}

function build(S, C, sigma, m, q){
  const base = Math.floor(S/m), extra = S % m, sizes = [];
  for(let i = 0; i < m; i++) sizes.push(base + (i < extra ? 1 : 0));
  const label = new Int32Array(S);
  let idx = 0;
  for(let b = 0; b < m; b++) for(let k = 0; k < sizes[b]; k++) label[idx++] = b;

  let withinCells = 0;
  for(const n of sizes) withinCells += n*(n-1);
  const totalCells = S*(S-1);
  const pIn = m === 1 ? 1 : withinCells/totalCells;

  let Cin, Cout, capped = false;
  if(m === 1){ Cin = C; Cout = C; }
  else{
    Cout = C*(1-q);
    Cin = (C - (1-pIn)*Cout)/pIn;
    if(Cin > 1){
      Cin = 1;
      Cout = Math.max(0, (C - pIn)/(1 - pIn));
      capped = true;
    }
  }

  const A = new Float64Array(S*S);
  for(let i = 0; i < S; i++){
    for(let j = 0; j < S; j++){
      if(i === j){ A[i*S+j] = -1; continue; }
      const g = i*SMAX + j;
      const p = label[i] === label[j] ? Cin : Cout;
      A[i*S+j] = U[g] < p ? sigma*Z[g] : 0;
    }
  }
  return {A, Cin, Cout, capped, crossCells: totalCells - withinCells};
}

let els = {}, spectrum = null, state = {};

function draw(){
  const cv = els.canvas;
  if(!cv || !spectrum) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h) return;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const css = getComputedStyle(document.documentElement);
  const CYAN = css.getPropertyValue("--cyan").trim() || "#4dd8ff";
  const PINK = css.getPropertyValue("--pink").trim() || "#ff99cc";
  const ORANGE = css.getPropertyValue("--orange").trim() || "#ff6633";
  const GREY = css.getPropertyValue("--grey").trim() || "#888888";
  const PANEL = css.getPropertyValue("--panel").trim() || "#1e1e1e";

  const R = state.quantity;
  const viewR = Math.max(R, 1)*1.5;
  const scale = (h/2)/viewR;
  const cx = w/2 + 1*scale;          /* disk centre sits at Re = -1 */
  const cy = h/2;
  const X = re => cx + re*scale;
  const Y = im => cy - im*scale;

  /* real axis */
  g.strokeStyle = GREY; g.globalAlpha = .22; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(w, Y(0)); g.stroke();
  g.globalAlpha = 1;

  /* critical radius: the circle that is exactly tangent to the stability line */
  g.strokeStyle = GREY; g.globalAlpha = .55; g.lineWidth = 1.5;
  g.setLineDash([5, 4]);
  g.beginPath(); g.arc(X(-1), Y(0), scale, 0, Math.PI*2); g.stroke();
  g.setLineDash([]); g.globalAlpha = 1;

  /* predicted radius for these settings */
  g.strokeStyle = CYAN; g.globalAlpha = .5; g.lineWidth = 2;
  g.beginPath(); g.arc(X(-1), Y(0), R*scale, 0, Math.PI*2); g.stroke();
  g.globalAlpha = 1;

  /* the stability line */
  g.strokeStyle = PINK; g.lineWidth = 2;
  g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), h); g.stroke();

  g.font = '500 11px "Geist Mono", ui-monospace, Menlo, monospace';
  g.fillStyle = PINK; g.textAlign = "left";
  g.fillText("Re = 0", X(0) + 7, 18);
  g.fillStyle = GREY; g.textAlign = "right";
  g.fillText("critical radius", X(-1) - scale - 8, Y(0) - 7);

  /* eigenvalues */
  const n = spectrum.n;
  for(let i = 0; i < n; i++){
    const re = spectrum.re[i], im = spectrum.im[i];
    const over = re > 0;
    g.beginPath();
    g.arc(X(re), Y(im), over ? 4.6 : 3.4, 0, Math.PI*2);
    g.fillStyle = over ? ORANGE : CYAN;
    g.strokeStyle = PANEL; g.lineWidth = 1.6;
    g.fill(); g.stroke();
  }
}

function compute(){
  const S = +els.S.value, C = +els.C.value, sigma = +els.sig.value;
  const m = +els.m.value, q = +els.q.value;

  const t0 = performance.now();
  const {A, Cin, Cout, capped, crossCells} = build(S, C, sigma, m, q);
  const ev = eigenvalues(A, S);
  const ms = performance.now() - t0;

  let maxRe = -Infinity, crossers = 0;
  for(let i = 0; i < S; i++){
    if(ev.re[i] > maxRe) maxRe = ev.re[i];
    if(ev.re[i] > 0) crossers++;
  }
  spectrum = {re:ev.re, im:ev.im, n:S};
  const quantity = sigma*Math.sqrt(S*C);
  state = {quantity, maxRe, crossers};

  const stable = maxRe < 0;
  els.SOut.value = S;
  els.COut.value = C.toFixed(2);
  els.sigOut.value = sigma.toFixed(3);
  els.mOut.value = m;
  els.qOut.value = q.toFixed(2);

  els.quantity.value = quantity.toFixed(3);
  els.chip.textContent = stable ? "stable" : "unstable";
  els.chip.dataset.state = stable ? "stable" : "unstable";
  els.maxre.textContent = (maxRe >= 0 ? "+" : "") + maxRe.toFixed(3);
  els.crossers.textContent = crossers;
  els.cin.textContent = Cin.toFixed(3);
  els.cout.textContent = Cout.toFixed(3);
  els.walls.textContent = Math.round(Cout*crossCells).toLocaleString();
  els.timing.textContent = Math.round(ms) + " ms";

  /* meter: the pink tick marks 1, so the fill passing it is the transition */
  const pct = Math.min(quantity/1.5, 1)*100;
  els.meter.style.width = pct.toFixed(1) + "%";
  els.meter.dataset.state = stable ? "stable" : "unstable";

  els.note.hidden = !capped;
  if(capped) els.note.textContent =
    "Link budget capped: this many compartments cannot hold C = " + C.toFixed(2) +
    " inside them, so the realised connectance is below the target.";

  els.verdict.textContent = stable
    ? "Every eigenvalue sits left of zero. The community absorbs a small shock and returns."
    : crossers + (crossers === 1 ? " eigenvalue has" : " eigenvalues have") +
      " crossed the line. A small shock now grows instead of fading, and the community comes apart.";

  draw();
}

let pending = false;
function schedule(){
  if(pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; compute(); });
}

function boot(){
  const $ = id => document.getElementById(id);
  els = {
    canvas:$("plane"), S:$("S"), C:$("C"), sig:$("sig"), m:$("m"), q:$("q"),
    SOut:$("S-out"), COut:$("C-out"), sigOut:$("sig-out"), mOut:$("m-out"), qOut:$("q-out"),
    quantity:$("quantity"), chip:$("chip"), maxre:$("maxre"), crossers:$("crossers"),
    cin:$("cin"), cout:$("cout"), walls:$("walls"), timing:$("timing"),
    meter:$("meter"), note:$("note"), verdict:$("verdict-line"), resample:$("resample")
  };
  fillPool();
  ["S","C","sig","m","q"].forEach(k => els[k].addEventListener("input", schedule));
  els.resample.addEventListener("click", () => {
    seed = (seed*1664525 + 1013904223) >>> 0;
    fillPool();
    compute();
  });
  new ResizeObserver(draw).observe(els.canvas);
  compute();
}
</script>
